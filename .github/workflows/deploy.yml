name: Deploy to Hetzner

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.86.252
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /home/vaultra/app
            git pull origin main
            systemctl restart vaultra
            echo "✅ Deployed successfully"
