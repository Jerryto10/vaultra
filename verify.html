<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Compliance Receipt — Vaultra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black:  #0a0a0b;
      --white:  #f5f3ee;
      --gold:   #c9a84c;
      --gold2:  #e8c97a;
      --muted:  #6b6b6b;
      --border: #1e1e1e;
      --green:  #4caf7d;
      --red:    #e05252;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Instrument Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
    }
    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    .logo span { color: var(--gold); }
    .subtitle {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 48px;
    }
    .card {
      background: #0f0f10;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 36px;
      width: 100%;
      max-width: 640px;
    }
    .card-title {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    input {
      flex: 1;
      background: #151515;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--white);
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--gold); }
    input::placeholder { color: var(--muted); }
    button {
      background: var(--gold);
      color: var(--black);
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    button:hover { background: var(--gold2); }
    button:disabled { background: #333; color: var(--muted); cursor: not-allowed; }

    /* Result */
    .result { display: none; }
    .result.show { display: block; }
    .status-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid;
    }
    .status-bar.valid { background: rgba(76,175,125,0.08); border-color: rgba(76,175,125,0.3); }
    .status-bar.invalid { background: rgba(224,82,82,0.08); border-color: rgba(224,82,82,0.3); }
    .status-icon { font-size: 1.4rem; }
    .status-text { flex: 1; }
    .status-title { font-weight: 600; font-size: 1rem; }
    .status-title.valid { color: var(--green); }
    .status-title.invalid { color: var(--red); }
    .status-sub { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { background: #151515; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
    .field-label { font-family: 'DM Mono', monospace; font-size: 0.58rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
    .field-value { font-family: 'DM Mono', monospace; font-size: 0.75rem; color: var(--white); word-break: break-all; }
    .field-value.gold { color: var(--gold); }
    .field-value.green { color: var(--green); }
    .field-value.red { color: var(--red); }
    .field-value.muted { color: var(--muted); }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      font-weight: 600;
    }
    .badge-green { background: rgba(76,175,125,0.15); color: var(--green); }
    .badge-gold { background: rgba(201,168,76,0.15); color: var(--gold); }
    .badge-red { background: rgba(224,82,82,0.15); color: var(--red); }

    .eidas-banner {
      margin-top: 16px;
      padding: 12px 16px;
      background: rgba(201,168,76,0.06);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 8px;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .eidas-banner strong { color: var(--gold); }

    .error-msg {
      text-align: center;
      padding: 24px;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      color: var(--red);
    }

    .loading {
      text-align: center;
      padding: 24px;
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      display: none;
    }
    .loading.show { display: block; }

    .footer {
      margin-top: 32px;
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
    }
    .footer a { color: var(--gold); text-decoration: none; }

    @media (max-width: 560px) {
      .fields { grid-template-columns: 1fr; }
      .input-row { flex-direction: column; }
    }
  </style>
</head>
<body>

  <a href="/" style="text-decoration:none;">
    <div class="logo">Vault<span>ra</span></div>
  </a>
  <div class="subtitle">Compliance Receipt Verifier</div>

  <div class="card">
    <div class="card-title">Verify a Compliance Receipt</div>
    <div class="input-row">
      <input type="text" id="receipt-input"
        placeholder="Enter Receipt ID (e.g. 1198f044-134a-4299-8b72-c4620f398fd5)"
        onkeydown="if(event.key==='Enter')verify()" />
      <button onclick="verify()" id="verify-btn">Verify →</button>
    </div>

    <div class="loading" id="loading">⟳ Verifying receipt...</div>

    <div class="result" id="result">
      <!-- Injected by JS -->
    </div>
  </div>

  <div class="footer">
    Powered by <a href="/">Vaultra</a> — AI Agent Compliance Layer ·
    <a href="https://admin.vaultra.io">Admin Panel</a>
  </div>

<script>
  // Read receipt ID from URL path: /verify/<id>
  const pathParts = window.location.pathname.split('/');
  const urlReceiptId = pathParts[pathParts.length - 1];
  if (urlReceiptId && urlReceiptId !== 'verify' && urlReceiptId.length > 8) {
    document.getElementById('receipt-input').value = urlReceiptId;
    window.addEventListener('DOMContentLoaded', () => verify());
  }

  async function verify() {
    const rid = document.getElementById('receipt-input').value.trim();
    if (!rid) return;

    const btn = document.getElementById('verify-btn');
    const loading = document.getElementById('loading');
    const result = document.getElementById('result');

    btn.disabled = true;
    btn.textContent = 'Verifying...';
    loading.classList.add('show');
    result.classList.remove('show');
    result.innerHTML = '';

    try {
      const res = await fetch('https://admin.vaultra.io/api/verify/' + encodeURIComponent(rid));
      const data = await res.json();

      if (data.valid) {
        const rfcBadge = data.rfc3161_valid
          ? '<span class="badge badge-green">✓ STAMPED</span>'
          : '<span class="badge badge-gold">⏳ PENDING</span>';

        const dtClass = (data.decision_type || '').includes('APPROVED') ? 'green'
          : (data.decision_type || '').includes('REJECTED') ? 'red' : 'gold';

        result.innerHTML = `
          <div class="status-bar valid">
            <div class="status-icon">✓</div>
            <div class="status-text">
              <div class="status-title valid">Receipt Valid</div>
              <div class="status-sub">Cryptographically verified — tamper-proof compliance record</div>
            </div>
          </div>
          <div class="fields">
            <div class="field">
              <div class="field-label">Receipt ID</div>
              <div class="field-value gold">${data.receipt_id}</div>
            </div>
            <div class="field">
              <div class="field-label">Status</div>
              <div class="field-value green">${(data.status || '').toUpperCase()}</div>
            </div>
            <div class="field">
              <div class="field-label">Decision Type</div>
              <div class="field-value ${dtClass}">${data.decision_type || '—'}</div>
            </div>
            <div class="field">
              <div class="field-label">Regulation</div>
              <div class="field-value">${data.regulation || '—'}</div>
            </div>
            <div class="field">
              <div class="field-label">Agent ID</div>
              <div class="field-value muted">${data.agent_id || '—'}</div>
            </div>
            <div class="field">
              <div class="field-label">Block #</div>
              <div class="field-value muted">#${data.block_number}</div>
            </div>
            <div class="field">
              <div class="field-label">RFC 3161 Timestamp</div>
              <div class="field-value">${rfcBadge} ${data.rfc3161_ts || 'Pending DigiCert TSA'}</div>
            </div>
            <div class="field">
              <div class="field-label">Created</div>
              <div class="field-value muted">${data.created_at} UTC</div>
            </div>
            <div class="field" style="grid-column:1/-1">
              <div class="field-label">Input Hash (SHA-256)</div>
              <div class="field-value muted" style="font-size:0.65rem;">${data.input_hash || '—'}</div>
            </div>
          </div>
          ${data.rfc3161_valid ? `
          <div class="eidas-banner">
            <strong>eIDAS Art. 41 Compliant</strong> — This receipt is sealed with an RFC 3161 trusted timestamp
            issued by DigiCert, a qualified trust service provider. The timestamp has full legal standing
            as a trusted electronic timestamp across the EU. It cannot be altered by any party, including Vaultra.
          </div>` : ''}
        `;
      } else {
        result.innerHTML = `
          <div class="status-bar invalid">
            <div class="status-icon">✗</div>
            <div class="status-text">
              <div class="status-title invalid">Receipt Not Found</div>
              <div class="status-sub">No compliance receipt found with this ID</div>
            </div>
          </div>
          <div class="error-msg">
            Receipt ID <strong>${rid}</strong> was not found in the Vaultra ledger.<br/>
            Please check the ID and try again.
          </div>
        `;
      }
    } catch (e) {
      result.innerHTML = `<div class="error-msg">Connection error — please try again.<br/><small>${e.message}</small></div>`;
    }

    result.classList.add('show');
    loading.classList.remove('show');
    btn.disabled = false;
    btn.textContent = 'Verify →';
  }
</script>
</body>
</html>
