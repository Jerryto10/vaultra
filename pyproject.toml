[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultra"
version = "2.0.0"
description = "AI Agent Compliance Layer — cryptographic proof for every AI decision"
readme = "README.md"
license = { text = "AGPL-3.0" }
authors = [{ name = "Jerly Rojas", email = "hello@vaultra.io" }]
keywords = ["ai", "compliance", "eu-ai-act", "gdpr", "eidas", "fintech", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "cryptography>=41.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
]

[project.urls]
Homepage = "https://vaultra.io"
Documentation = "https://vaultra.io"
Repository = "https://github.com/Jerryto10/vaultra"
"Bug Tracker" = "https://github.com/Jerryto10/vaultra/issues"

[tool.setuptools.packages.find]
include = ["vaultra*"]
exclude = ["admin*", "tests*"]
