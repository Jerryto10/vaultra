<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vaultra Admin — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=JetBrains+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--bg:#090909;--surface:#101010;--border:#1E1E1E;--gold:#C9A84C;--gold-dim:rgba(201,168,76,0.10);--text:#E8E8E0;--muted:#555;--mono:'JetBrains Mono',monospace;--serif:'DM Serif Display',serif;--sans:'Instrument Sans',sans-serif;}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .login-wrap{width:100%;max-width:380px;padding:20px;}
    .logo{font-family:var(--serif);font-size:1.8rem;color:var(--text);text-align:center;margin-bottom:4px;}
    .logo span{color:var(--gold);}
    .logo-sub{font-family:var(--mono);font-size:0.58rem;color:var(--muted);text-align:center;letter-spacing:0.14em;margin-bottom:32px;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:32px;}
    .card-title{font-family:var(--mono);font-size:0.62rem;color:var(--muted);letter-spacing:0.12em;margin-bottom:24px;text-align:center;}
    .field{margin-bottom:16px;}
    .field label{font-family:var(--mono);font-size:0.6rem;color:var(--muted);letter-spacing:0.1em;display:block;margin-bottom:6px;}
    .field input{width:100%;background:#151515;border:1px solid var(--border);border-radius:5px;padding:10px 14px;color:var(--text);font-family:var(--mono);font-size:0.78rem;outline:none;transition:border-color 0.15s;}
    .field input:focus{border-color:var(--gold);}
    .btn-login{width:100%;background:var(--gold);color:#000;border:none;border-radius:5px;padding:11px;font-family:var(--mono);font-size:0.7rem;font-weight:700;letter-spacing:0.06em;cursor:pointer;margin-top:8px;transition:background 0.15s;}
    .btn-login:hover{background:#D4B560;}
    .error{background:rgba(207,102,121,0.1);border:1px solid rgba(207,102,121,0.3);border-radius:5px;padding:10px 14px;font-family:var(--mono);font-size:0.65rem;color:#CF6679;margin-bottom:16px;text-align:center;}
    .footer-note{font-family:var(--mono);font-size:0.56rem;color:var(--muted);text-align:center;margin-top:20px;}
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="logo">Vault<span>ra</span></div>
    <div class="logo-sub">ADMIN PANEL — RESTRICTED ACCESS</div>
    <div class="card">
      <div class="card-title">SIGN IN TO CONTINUE</div>
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      <form method="POST" action="/login">
        <div class="field">
          <label>USERNAME</label>
          <input type="text" name="username" placeholder="admin" autocomplete="username" required />
        </div>
        <div class="field">
          <label>PASSWORD</label>
          <input type="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-login">SIGN IN →</button>
      </form>
    </div>
    <div class="footer-note">© 2026 Vaultra — Confidential — <a href="/cdn-cgi/l/email-protection" class="__c
